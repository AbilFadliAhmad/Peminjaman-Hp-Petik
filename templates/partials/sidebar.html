<!-- Overlay -->
<div
    id="sidebarOverlay"
    class="fixed inset-0 z-40 hidden bg-black/40 lg:hidden">
</div>

<aside
    id="sidebar"
    class="fixed left-0 top-0 z-50 flex h-screen w-72 -translate-x-full flex-col border-r bg-white shadow-xl transition-transform duration-300 lg:translate-x-0">

    <!-- Header -->

    <!-- Header -->

<div class="flex h-16 items-center border-b border-slate-200 bg-gradient-to-r from-blue-600 to-blue-700 px-5">

    <div class="flex items-center gap-3">

        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/15 text-white">

            <svg xmlns="http://www.w3.org/2000/svg"
                 class="h-5 w-5"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 12l2 2 4-4M12 22C7 20 4 16 4 10V5l8-3 8 3v5c0 6-3 10-8 12z"/>

            </svg>

        </div>

        <div>

            <h1 class="text-lg font-bold text-white">

                IZININ

            </h1>

            <p class="text-[11px] uppercase tracking-wide text-blue-100">

                Smart Permission System

            </p>

        </div>

    </div>

</div>

    <!-- Menu -->

    <!-- Menu -->

<nav class="flex-1 space-y-2 overflow-y-auto p-4">

    {% for menu in menus %}

    <a
        href="{{ url_for(menu.endpoint) }}"
        class="
        group flex items-center gap-3 rounded-2xl px-4 py-3 transition-all duration-200

        {% if current_endpoint == menu.endpoint %}

            bg-blue-600 text-white shadow-lg shadow-blue-100

        {% else %}

            text-slate-700 hover:bg-slate-100 hover:translate-x-1

        {% endif %}
        ">

        <span class="text-xl transition group-hover:scale-110">

            {{ menu.icon }}

        </span>

        <span class="font-medium">

            {{ menu.title }}

        </span>

    </a>

    {% endfor %}

</nav>

    <div class="border-t border-slate-200 p-4">

    <a
        href="{{ url_for('logout') }}"
        class="flex items-center justify-center gap-2 rounded-2xl border border-red-200 bg-red-50 py-3 font-medium text-red-600 transition hover:bg-red-100">

        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-5 w-5"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"/>

        </svg>

        Keluar

    </a>

</div>

</aside>
