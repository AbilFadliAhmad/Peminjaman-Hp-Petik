<!-- Overlay -->
<div
    id="sidebarOverlay"
    class="fixed inset-0 z-40 hidden bg-black/40 lg:hidden">
</div>

<aside
    id="sidebar"
    class="fixed left-0 top-0 z-50 flex h-screen w-72 -translate-x-full flex-col border-r bg-white shadow-xl transition-transform duration-300 lg:translate-x-0">

    <!-- Header -->

    <div class="flex h-16 items-center justify-center border-b">

        <div class="flex items-center gap-3">

            <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-600 text-xl text-white shadow">

                📱

            </div>

            <div>

                <h1 class="text-lg font-bold tracking-wide text-slate-800">

                    PINJAMIN

                </h1>

                <p class="text-xs text-slate-500">

                    Sistem Peminjaman HP

                </p>

            </div>

        </div>

    </div>

    <!-- Menu -->

    <nav class="flex-1 space-y-2 overflow-y-auto p-4">

        {% for menu in menus %}

        <a
            href="{{ url_for(menu.endpoint) }}"
            class="
            flex items-center gap-3 rounded-xl px-4 py-3 transition

            {% if current_endpoint == menu.endpoint %}

                bg-blue-600 text-white shadow-md

            {% else %}

                text-slate-700 hover:bg-slate-100

            {% endif %}
            ">

            <span class="text-xl">

                {{ menu.icon }}

            </span>

            <span class="font-medium">

                {{ menu.title }}

            </span>

        </a>

        {% endfor %}

    </nav>

    <div class="border-t p-4">

        <a
            href="{{ url_for('logout') }}"
            class="flex items-center justify-center rounded-xl bg-red-500 py-3 font-medium text-white transition hover:bg-red-600">

            Logout

        </a>

    </div>

</aside>
