{% extends 'layouts/base.html' %}

{% block title %}
Login - Sistem Peminjaman HP
{% endblock %}

{% block auth %}

<div class="w-full max-w-md">

    <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">

        <!-- Logo -->
        <div class="text-center mb-8">

            <div class="w-20 h-20 mx-auto rounded-full bg-blue-600 flex items-center justify-center text-4xl text-white">

                📱

            </div>

            <h1 class="mt-5 text-3xl font-bold text-gray-800">
                Peminjaman HP
            </h1>

            <p class="mt-2 text-gray-500">
                Silakan login menggunakan akun Anda
            </p>

        </div>

        {% include 'partials/flash.html' %}

        <form method="POST"
              action="{{ url_for('login') }}"
              class="space-y-5">

            <!-- Username -->
            <div>

                <label class="block text-sm font-medium text-gray-700 mb-2">

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Masukkan username"
                    required
                    autofocus
                    autocomplete="username"
                    value="{{ request.form.get('username', '') }}"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">

            </div>

            <!-- Password -->
            <div>

                <label class="block text-sm font-medium text-gray-700 mb-2">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Masukkan password"
                    required
                    autocomplete="current-password"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">

            </div>

            <!-- Tombol Login -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg py-3 transition">

                Login

            </button>

        </form>
    </div>

</div>

{% endblock %}
